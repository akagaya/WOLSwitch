name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist/WOLSwitch | Out-Null
          Copy-Item build/Release/WOLSwitch.exe dist/WOLSwitch/
          windeployqt --release --no-translations dist/WOLSwitch/WOLSwitch.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WOLSwitch-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: macdeployqt build/WOLSwitch.app -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: WOLSwitch-macos-universal
          path: build/WOLSwitch.dmg
