name: Build

on:
  push:
  workflow_dispatch:

# 古い実行が後から完了して新しい成果物を消さないよう、実行は常に 1 つにする
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist/WOLSwitch | Out-Null
          Copy-Item build/Release/WOLSwitch.exe dist/WOLSwitch/
          windeployqt --release --no-translations dist/WOLSwitch/WOLSwitch.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WOLSwitch-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: macdeployqt build/WOLSwitch.app -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: WOLSwitch-macos-universal
          path: build/WOLSwitch.dmg

  # 両方のビルドが成功した場合のみ、過去の実行の成果物を削除して最新の 1 セットだけ残す
  cleanup:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from older runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != $RUN_ID) | .id" |
          while read -r id; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done
